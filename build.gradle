plugins { id "net.fabricmc.fabric-loom" version "1.18-SNAPSHOT" }

version = "0.1.0+26.2"
group = "dev.nuulz"

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
    implementation "com.github.Nuulz:pane:v0.2.1"
    include "com.github.Nuulz:pane:v0.2.1"
    // D-Bus, for the screen-cast portal on Linux (Wayland window picker); pure Java over JDK unix sockets
    implementation "com.github.hypfvieh:dbus-java-core:5.1.1"
    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:5.1.1"
    include "com.github.hypfvieh:dbus-java-core:5.1.1"
    include "com.github.hypfvieh:dbus-java-transport-native-unixsocket:5.1.1"
    // Mod Menu's Config button; compile-only, Chorus works without it
    compileOnly "com.terraformersmc:modmenu:20.0.3"
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { filesMatching("fabric.mod.json") { expand(version: version) } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "chorus-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

