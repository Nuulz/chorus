plugins { id "net.fabricmc.fabric-loom" version "1.18-SNAPSHOT" }

version = "0.1.0+26.2"
group = "dev.nuulz"

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://jitpack.io" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
    implementation "com.github.Nuulz:pane:v0.1.1"
    include "com.github.Nuulz:pane:v0.1.1"
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { filesMatching("fabric.mod.json") { expand(version: version) } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "chorus-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// The test game starts from an empty folder: reuse an already downloaded Chromium so it doesn't fetch 120 MB.
def browserCopy = tasks.register("browserCopy", Copy) {
    dependsOn "deleteGameTestRunDir"
    from(file("${System.getProperty('user.home')}/.local/share/PrismLauncher/instances/jukz-26.2/.minecraft/jukz-browser")) {
        include "linux_amd64/**", "linux_amd64.sha256"
    }
    into "build/run/clientGameTest/chorus-browser"
}
tasks.named("runClientGameTest") { dependsOn browserCopy }
